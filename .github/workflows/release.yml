name: release

# Bun-compile the harness for every platform the worker embeds, then publish a
# `harness-vX.Y.Z` GitHub release. The worker's build step downloads the binary
# matching its Rust target triple and embeds it via include_bytes! (zstd).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            bun_target: bun-darwin-arm64
            triple: aarch64-apple-darwin
            ext: ""
          - os: macos-14
            bun_target: bun-darwin-x64
            triple: x86_64-apple-darwin
            ext: ""
          - os: ubuntu-latest
            bun_target: bun-linux-x64
            triple: x86_64-unknown-linux-gnu
            ext: ""
          - os: windows-latest
            bun_target: bun-windows-x64
            triple: x86_64-pc-windows-msvc
            ext: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: smoke (graph compiles)
        run: bun run src/index.ts smoke
      - name: compile
        shell: bash
        run: |
          mkdir -p dist
          bun build --compile --minify \
            --target ${{ matrix.bun_target }} \
            --outfile "dist/myra-harness-${{ matrix.triple }}${{ matrix.ext }}" \
            src/index.ts
      - uses: actions/upload-artifact@v4
        with:
          name: myra-harness-${{ matrix.triple }}
          path: dist/myra-harness-${{ matrix.triple }}${{ matrix.ext }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/myra-harness-*
          fail_on_unmatched_files: true
          generate_release_notes: true
